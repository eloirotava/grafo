<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Início - RotavaFlow</title>
    <link rel="manifest" href="./static/manifest.json">
    <script src="./static/js/fabric.min.js"></script>
    <script src="./static/js/chart.js"></script>
    <style>
        /* Estilos do Layout */
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f0f0; display: flex; flex-direction: column; overflow: hidden; }
        .menubar { height: 35px; background-color: #333; display: flex; align-items: center; padding: 0 10px; user-select: none; }
        .nav-link { text-decoration: none; color: #ccc; padding: 0 15px; font-size: 13px; height: 100%; display: flex; align-items: center; transition: all 0.2s; }
        .nav-link:hover { background-color: #444; color: white; }
        .nav-link.active { background-color: #0078d7; color: white; font-weight: bold; }
        .main-container { flex-grow: 1; display: flex; position: relative; height: calc(100vh - 35px); overflow: auto; flex-direction: column; background: #eef2f5; }

        /* Estilos da Home */
        .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; text-align: center; color: #444; background: radial-gradient(circle at center, #fff 0%, #f4f4f4 100%); }
        .hero h1 { font-size: 3em; font-weight: 300; margin-bottom: 10px; color: #222; }
        .hero p { font-size: 1.2em; color: #666; max-width: 600px; margin-bottom: 40px; }
        .cta-button { padding: 15px 40px; font-size: 1.2em; background-color: #0078d7; color: white; text-decoration: none; border-radius: 50px; font-weight: 600; box-shadow: 0 4px 15px rgba(0, 120, 215, 0.3); transition: transform 0.2s, box-shadow 0.2s; }
        .cta-button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 120, 215, 0.4); background-color: #005a9e; }
        .version { margin-top: 60px; font-size: 0.9em; color: #999; }
    </style>
</head>
<body>
    <div class="menubar">
        <a href="#" class="nav-link active">Início</a>
        <a href="./pages/canvas.html" class="nav-link">Editor P&ID</a>
        <a href="./pages/nodes.html" class="nav-link">Nós</a>
        <a href="./pages/ducts.html" class="nav-link">Tubos</a>
        <a href="./pages/equipments.html" class="nav-link">Equipamentos</a>
        <a href="./pages/simulation.html" class="nav-link">Simulação</a>
        <a href="./pages/reports.html" class="nav-link">Relatórios</a>
        <a href="./pages/help.html" class="nav-link" style="margin-left: auto;">Ajuda</a>
    </div>

    <div class="main-container">
        <div class="hero">
            <div style="font-size: 4em; margin-bottom: 20px;">🌊</div>
            <h1>RotavaFlow</h1>
            <p>Simulação de escoamento composicional offline, rápida e precisa direto no seu navegador.</p>
            <a href="./pages/canvas.html" class="cta-button">Iniciar Novo Projeto</a>
            <div class="version">Versão 2.1 (WASM Edition) • Modo Offline Ativo</div>
        </div>
    </div>

    <script src="./static/js/pwa.js" defer></script>
</body>
</html>
