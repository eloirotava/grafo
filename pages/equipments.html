<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>RotavaFlow - Equipamentos</title>
    <link rel="manifest" href="../static/manifest.json">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f0f0; display: flex; flex-direction: column; overflow: hidden; }
        .menubar { height: 35px; background-color: #333; display: flex; align-items: center; padding: 0 10px; user-select: none; }
        .nav-link { text-decoration: none; color: #ccc; padding: 0 15px; font-size: 13px; height: 100%; display: flex; align-items: center; transition: all 0.2s; }
        .nav-link:hover { background-color: #444; color: white; }
        .nav-link.active { background-color: #0078d7; color: white; font-weight: bold; }
        .main-container { flex-grow: 1; display: flex; position: relative; height: calc(100vh - 35px); overflow: auto; flex-direction: column; background: #eef2f5; }

        /* Estilos específicos - Equipments */
        .page-content { padding: 30px; width: 100%; max-width: 1200px; margin: 0 auto; }
        h2 { color: #333; border-bottom: 2px solid #0078d7; padding-bottom: 10px; margin-bottom: 20px; }
        .data-table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-radius: 4px; font-size: 13px; }
        .data-table th, .data-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        .data-table th { background-color: #f8f9fa; font-weight: 600; color: #444; border-bottom: 2px solid #ddd; }
        .input-cell { width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; }
        .input-cell:disabled { background-color: #f5f5f5; color: #aaa; cursor: not-allowed; }
        .row-P { border-left: 4px solid #27ae60; }
        .row-Q { border-left: 4px solid #e67e22; }
        .row-A { border-left: 4px solid #9b59b6; }
        .row-F { border-left: 4px solid #c0392b; }
        .badge { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #555; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="menubar">
        <a href="../index.html" class="nav-link">Início</a>
        <a href="canvas.html" class="nav-link">Editor P&ID</a>
        <a href="nodes.html" class="nav-link">Nós</a>
        <a href="ducts.html" class="nav-link">Tubos</a>
        <a href="#" class="nav-link active">Equipamentos</a>
        <a href="simulation.html" class="nav-link">Simulação</a>
        <a href="reports.html" class="nav-link">Relatórios</a>
        <a href="help.html" class="nav-link" style="margin-left: auto;">Ajuda</a>
    </div>

    <div class="main-container">
        <div class="page-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Equipamentos e Válvulas</h2>
                <span id="save-status" style="color:green; font-weight:bold; opacity:0; transition: opacity 0.5s;">Salvo!</span>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">Tag</th>
                        <th style="width: 15%;">Tipo</th>
                        <th style="width: 15%;">Valor (Set/%)</th>
                        <th style="width: 20%;">Duto (Instalação)</th>
                        <th style="width: 15%;">Pos (%) <small style="color:#999; font-weight:normal">(Visual)</small></th>
                        <th style="width: 20%;">Tramo (seg_index)</th>
                    </tr>
                </thead>
                <tbody id="equips-body"></tbody>
            </table>
        </div>
    </div>


    <script>
        let globalData = {};
        let valvesList = [];

        function init() {
            const raw = localStorage.getItem('malha_db_v2');
            if (!raw) return;
            globalData = JSON.parse(raw);

            const ductMap = new Map();
            if(globalData.ducts) globalData.ducts.forEach(d => ductMap.set(d.id, d));

            const geomMap = new Map();
            if(globalData.duct_geom) {
                globalData.duct_geom.forEach(g => {
                    if(!geomMap.has(g.duct_id)) geomMap.set(g.duct_id, []);
                    geomMap.get(g.duct_id).push(g);
                });
            }

            let sourceValves = globalData.valves || [];
            if (sourceValves.length === 0 && globalData.nodes) {
                sourceValves = globalData.nodes.filter(n => n.type === 'valve').map(n => ({
                    id: n.id,
                    name: n.name,
                    type: n.originalType || 'A',
                    duct_id: n.attachedTo || n.attachedDuctId,
                    t: n.ratio || 0.5,
                    value: (n.props && n.props.value) || 0,
                    seg_index: (n.props && n.props.seg_index) 
                }));
            }

            valvesList = sourceValves.map(v => {
                const props = v.props || {};
                const value = v.value !== undefined ? v.value : (props.value !== undefined ? props.value : 0);
                
                let currentSeg = v.seg_index;
                if (currentSeg === undefined || currentSeg === null) {
                    const geom = geomMap.get(v.duct_id) || [];
                    if (geom.length > 0) {
                        geom.sort((a,b) => (a.seg_index||0) - (b.seg_index||0));
                        const totalL = geom.reduce((acc, g) => acc + (parseFloat(g.length)||0), 0);
                        const targetL = (v.t || 0.5) * totalL;
                        let currentL = 0;
                        for(let g of geom) {
                            currentL += (parseFloat(g.length)||0);
                            if (currentL >= targetL) {
                                currentSeg = g.seg_index;
                                break;
                            }
                        }
                        if (currentSeg === undefined) currentSeg = geom[geom.length-1].seg_index;
                    } else {
                        currentSeg = 0; 
                    }
                }

                return {
                    ...v,
                    value,
                    seg_index: currentSeg,
                    ductName: ductMap.has(v.duct_id) ? ductMap.get(v.duct_id).name : (v.duct_id || '?')
                };
            });

            render();
        }

        function render() {
            const tbody = document.getElementById('equips-body');
            tbody.innerHTML = '';

            if (valvesList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#999;">Nenhuma válvula encontrada.</td></tr>';
                return;
            }

            valvesList.forEach(v => {
                const tr = document.createElement('tr');
                tr.className = `row-${v.type}`; 
                const isEditable = (v.type === 'P' || v.type === 'Q' || v.type === 'A');

                tr.innerHTML = `
                    <td><strong>${v.name}</strong></td>
                    <td>
                        <select class="input-cell" onchange="updateValve('${v.id}', 'type', this.value)">
                            <option value="A" ${v.type==='A'?'selected':''}>A (Aberto)</option>
                            <option value="F" ${v.type==='F'?'selected':''}>F (Fechada)</option>
                            <option value="P" ${v.type==='P'?'selected':''}>P (Pressão)</option>
                            <option value="Q" ${v.type==='Q'?'selected':''}>Q (Vazão)</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" class="input-cell" value="${v.value}" step="0.1" 
                        ${!isEditable ? 'disabled' : ''} onchange="updateValve('${v.id}', 'value', this.value)">
                    </td>
                    <td><span class="badge">${v.ductName}</span></td>
                    <td style="color:#666;">${Math.round((v.t||0)*100)}%</td>
                    <td>
                        <input type="number" class="input-cell" value="${v.seg_index}" step="1" 
                        onchange="updateValve('${v.id}', 'seg_index', this.value)">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.updateValve = function(id, field, value) {
            const v = valvesList.find(x => x.id === id);
            if (v) {
                if (field === 'value' || field === 'seg_index' || field === 't') {
                    v[field] = parseFloat(value);
                } else {
                    v[field] = value;
                }
                save();
                if (field === 'type') render();
            }
        };

        function save() {
            globalData.valves = valvesList.map(v => ({
                id: v.id, name: v.name, type: v.type, value: v.value, duct_id: v.duct_id,
                t: v.t, seg_index: v.seg_index, props: { value: v.value, seg_index: v.seg_index } 
            }));

            if (globalData.nodes) {
                globalData.nodes.forEach(n => {
                    if (n.type === 'valve') {
                        const updated = valvesList.find(v => v.id === n.id);
                        if (updated) {
                            n.originalType = updated.type;
                            if (!n.props) n.props = {};
                            n.props.value = updated.value;
                            n.props.seg_index = updated.seg_index; 
                        }
                    }
                });
            }

            localStorage.setItem('malha_db_v2', JSON.stringify(globalData));
            const status = document.getElementById('save-status');
            status.style.opacity = 1;
            setTimeout(() => status.style.opacity = 0, 1500);
        }

        init();
    </script>
    <script src="../static/js/pwa.js" defer></script>
</body>
</html>
