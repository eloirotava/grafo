<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>RotavaFlow - Nós</title>
    <link rel="manifest" href="../static/manifest.json">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f0f0; display: flex; flex-direction: column; overflow: hidden; }
        .menubar { height: 35px; background-color: #333; display: flex; align-items: center; padding: 0 10px; user-select: none; }
        .nav-link { text-decoration: none; color: #ccc; padding: 0 15px; font-size: 13px; height: 100%; display: flex; align-items: center; transition: all 0.2s; }
        .nav-link:hover { background-color: #444; color: white; }
        .nav-link.active { background-color: #0078d7; color: white; font-weight: bold; }
        .main-container { flex-grow: 1; display: flex; position: relative; height: calc(100vh - 35px); overflow: auto; flex-direction: column; background: #eef2f5; }

        /* Estilos específicos da página de Nós */
        .page-content { padding: 30px; width: 100%; max-width: 1600px; margin: 0 auto; }
        h2 { color: #333; border-bottom: 2px solid #0078d7; padding-bottom: 10px; margin-bottom: 20px; }
        .table-wrap { width: 100%; overflow: auto; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-radius: 4px; }
        .data-table { min-width: 1750px; width: 100%; border-collapse: collapse; background: white; font-size: 13px; }
        .data-table th, .data-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        .data-table th { background-color: #f8f9fa; font-weight: 600; color: #444; border-bottom: 2px solid #ddd; }
        .input-cell { width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; }
        .input-cell:disabled { background-color: #f5f5f5; color: #aaa; border-color: #e0e0e0; cursor: not-allowed; }
        .highlight-p { background-color: #e8f5e9; border-color: #a5d6a7; font-weight: bold; color: #1b5e20; }
        .highlight-q { background-color: #fff3e0; border-color: #ffcc80; font-weight: bold; color: #e65100; }
        .highlight-i { background-color: #e3f2fd; border-color: #90caf9; font-weight: bold; color: #0d47a1; }
        .comp-container { display: flex; flex-wrap: nowrap; gap: 8px; padding-bottom: 5px; min-width: 900px; }
        .comp-field { font-size: 10px; display: flex; flex-direction: column; min-width: 58px; }
        .comp-field input { width: 100%; border: 1px solid #ddd; padding: 4px; font-size: 12px; }
        .type-select { padding: 4px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; border: none; cursor: pointer; }
        .type-P { background-color: #27ae60; }
        .type-Q { background-color: #e67e22; }
        .type-I { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="menubar">
        <a href="../index.html" class="nav-link">Início</a>
        <a href="canvas.html" class="nav-link">Editor P&ID</a>
        <a href="#" class="nav-link active">Nós</a>
        <a href="ducts.html" class="nav-link">Tubos</a>
        <a href="equipments.html" class="nav-link">Equipamentos</a>
        <a href="simulation.html" class="nav-link">Simulação</a>
        <a href="reports.html" class="nav-link">Relatórios</a>
        <a href="help.html" class="nav-link" style="margin-left: auto;">Ajuda</a>
    </div>

    <div class="main-container">
        <div class="page-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Nós (Condições de Contorno)</h2>
                <span id="save-status" style="color:green; font-weight:bold; opacity:0; transition: opacity 0.5s;">Salvo!</span>
            </div>
            <div id="project-summary"></div>
            
            <div class="table-wrap">
                <table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 10%;">Tag</th>
                        <th style="width: 8%;">Tipo</th>
                        <th style="width: 12%;">Pressão (bar)</th>
                        <th style="width: 12%;">Vazão (kg/s)</th>
                        <th style="width: 10%;">Temp (°C)</th>
                        <th style="width: 10%;">Volume (m³)</th>
                        <th style="width: 52%; min-width: 920px;">Composição (% Molar)</th>
                    </tr>
                </thead>
                <tbody id="nodes-body"></tbody>
            </table>
            </div>
        </div>
    </div>

    <script>
        const SPECIES = ['N2','CO2','C1','C2','iC3','nC3','iC4','nC4','C5','C6','C7','C8','C9','C10+'];
        let globalNodes = [];
        let globalData = {};

        function init() {
            const raw = localStorage.getItem('malha_db_v2');
            if (!raw) return;
            globalData = JSON.parse(raw);
            
            const propsMap = new Map();
            if(globalData.node_props) globalData.node_props.forEach(p => propsMap.set(String(p.node_id), p));
            
            const compMap = new Map();
            if(globalData.node_composition) {
                globalData.node_composition.forEach(c => {
                    const id = String(c.node_id);
                    if(!compMap.has(id)) compMap.set(id, []);
                    compMap.get(id).push(c);
                });
            }

            globalNodes = (globalData.nodes || [])
                .filter(n => n.type !== 'valve')
                .map(n => {
                    const pid = String(n.id);
                    const phys = n.physics || propsMap.get(pid) || {};
                    const comps = n.composition || compMap.get(pid) || [];
                    
                    const compObj = {};
                    comps.forEach(c => {
                        const val = (c.value !== undefined) ? c.value : c.fraction;
                        if(val !== undefined && val !== null) compObj[c.component] = val;
                    });

                    return {
                        id: n.id,
                        name: n.name,
                        type: n.originalType || 'I',
                        physics: {
                            pressure: phys.pressure,
                            flow: phys.flow,
                            temperature: phys.temperature,
                            volume: phys.volume
                        },
                        comp: compObj
                    };
                });

            render();
        }

        function render() {
            const tbody = document.getElementById('nodes-body');
            tbody.innerHTML = '';
            
            if (globalNodes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:#999;">Nenhum nó encontrado.</td></tr>';
                return;
            }

            globalNodes.forEach((n) => {
                const tr = document.createElement('tr');
                const isP = n.type === 'P';
                const isQ = n.type === 'Q';
                const isI = n.type === 'I';

                const inputs = `
                    <td><input type="number" class="input-cell ${isP?'highlight-p':''}" value="${n.physics.pressure ?? ''}" step="0.1" ${!isP?'disabled':''} onchange="updatePhys('${n.id}', 'pressure', this.value)"></td>
                    <td><input type="number" class="input-cell ${isQ?'highlight-q':''}" value="${n.physics.flow ?? ''}" step="0.1" ${!isQ?'disabled':''} onchange="updatePhys('${n.id}', 'flow', this.value)"></td>
                    <td><input type="number" class="input-cell" value="${n.physics.temperature ?? ''}" step="1" onchange="updatePhys('${n.id}', 'temperature', this.value)"></td>
                    <td><input type="number" class="input-cell ${isI?'highlight-i':''}" value="${n.physics.volume ?? ''}" step="0.1" ${!isI?'disabled':''} onchange="updatePhys('${n.id}', 'volume', this.value)"></td>
                `;

                let compInputs = '<div class="comp-container">';
                SPECIES.forEach(sp => {
                    const val = n.comp[sp] ?? '';
                    compInputs += `<div class="comp-field">
                        <span style="color:#888">${sp}</span>
                        <input type="text" value="${val}" onchange="updateComp('${n.id}', '${sp}', this.value)">
                    </div>`;
                });
                compInputs += '</div>';

                tr.innerHTML = `
                    <td><strong>${n.name}</strong></td>
                    <td>
                        <select class="type-select type-${n.type}" onchange="updateType('${n.id}', this.value)">
                            <option value="P" ${n.type==='P'?'selected':''}>P</option>
                            <option value="Q" ${n.type==='Q'?'selected':''}>Q</option>
                            <option value="I" ${n.type==='I'?'selected':''}>I</option>
                        </select>
                    </td>
                    ${inputs}
                    <td>${compInputs}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.updateType = function(id, newType) {
            const node = globalNodes.find(n => String(n.id) === String(id));
            if(node) {
                node.type = newType;
                saveToStorage();
                render(); 
            }
        };

        window.updatePhys = function(id, field, value) {
            const node = globalNodes.find(n => String(n.id) === String(id));
            if(node) {
                node.physics[field] = value === '' ? null : parseFloat(value);
                saveToStorage();
            }
        };

        window.updateComp = function(id, compName, value) {
            const node = globalNodes.find(n => String(n.id) === String(id));
            if(node) {
                if(value === '') delete node.comp[compName];
                else node.comp[compName] = parseFloat(value);
                saveToStorage();
            }
        };

        function saveToStorage() {
            globalNodes.forEach(gn => {
                const originalNode = globalData.nodes.find(n => String(n.id) === String(gn.id));
                if(originalNode) {
                    originalNode.originalType = gn.type; 
                    if(!originalNode.physics) originalNode.physics = {};
                    Object.assign(originalNode.physics, gn.physics);
                    originalNode.composition = Object.entries(gn.comp).map(([k, v]) => ({ component: k, value: v }));
                }
            });

            globalData.node_props = globalNodes.map(gn => ({
                node_id: gn.id,
                pressure: gn.physics.pressure,
                flow: gn.physics.flow,
                temperature: gn.physics.temperature,
                volume: gn.physics.volume
            }));

            globalData.node_composition = [];
            globalNodes.forEach(gn => {
                Object.entries(gn.comp).forEach(([k, v]) => {
                    globalData.node_composition.push({ 
                        node_id: gn.id, component: k, value: v, fraction: v 
                    });
                });
            });

            localStorage.setItem('malha_db_v2', JSON.stringify(globalData));
            const status = document.getElementById('save-status');
            status.style.opacity = 1;
            setTimeout(() => status.style.opacity = 0, 1500);
        }

        init();
    </script>
    <script src="../static/js/project-summary.js" defer></script>
    <script src="../static/js/pwa.js" defer></script>
</body>
</html>
