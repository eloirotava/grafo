<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#333333">
    <title>RotavaFlow - Nós</title>
    <link rel="icon" href="../static/icon.png" type="image/png">
    <link rel="stylesheet" href="../static/css/app.css">
    <link rel="manifest" href="../static/manifest.json">
    <script src="../static/js/app.js" defer></script>
    <style>
        /* Estilos específicos da página de Nós */
        .page-content { padding: 30px; width: 100%; max-width: 1400px; margin: 0 auto; }
        h2 { color: #333; border-bottom: 2px solid #0078d7; padding-bottom: 10px; margin-bottom: 20px; }
        .data-table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-radius: 4px; font-size: 13px; }
        .data-table th, .data-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        .data-table th { background-color: #f8f9fa; font-weight: 600; color: #444; border-bottom: 2px solid #ddd; }
        .input-cell { width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; }
        .input-cell:disabled { background-color: #f5f5f5; color: #aaa; border-color: #e0e0e0; cursor: not-allowed; }
        .highlight-p { background-color: #e8f5e9; border-color: #a5d6a7; font-weight: bold; color: #1b5e20; }
        .highlight-q { background-color: #fff3e0; border-color: #ffcc80; font-weight: bold; color: #e65100; }
        .highlight-i { background-color: #e3f2fd; border-color: #90caf9; font-weight: bold; color: #0d47a1; }
        .comp-container { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding-bottom: 5px; max-width: 500px; }
        .comp-container::-webkit-scrollbar { height: 6px; }
        .comp-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        .type-select { padding: 4px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; border: none; cursor: pointer; }
        .type-P { background-color: #27ae60; }
        .type-Q { background-color: #e67e22; }
        .type-I { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="menubar">
        <a href="../index.html" class="nav-link">Início</a>
        <a href="canvas.html" class="nav-link">Editor P&amp;ID</a>
        <a href="#" class="nav-link active">Nós</a>
        <a href="ducts.html" class="nav-link">Tubos</a>
        <a href="equipments.html" class="nav-link">Equipamentos</a>
        <a href="simulation.html" class="nav-link">Simulação</a>
        <a href="reports.html" class="nav-link">Relatórios</a>
        <a href="help.html" class="nav-link" style="margin-left: auto;">Ajuda</a>
    </div>

    <div class="main-container">
        <div class="page-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Nós (Condições de Contorno)</h2>
                <span id="save-status" style="color:green; font-weight:bold; opacity:0; transition: opacity 0.5s;">Salvo!</span>
            </div>
            
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 10%;">Tag</th>
                        <th style="width: 8%;">Tipo</th>
                        <th style="width: 12%;">Pressão (bar)</th>
                        <th style="width: 12%;">Vazão (kg/s)</th>
                        <th style="width: 10%;">Temp (°C)</th>
                        <th style="width: 10%;">Volume (m³)</th>
                        <th style="width: 38%;">Composição (% Molar)</th>
                    </tr>
                </thead>
                <tbody id="nodes-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SPECIES = ['N2','CO2','C1','C2','iC3','nC3','iC4','nC4','C5','C6','C7','C8','C9','C10+'];
        let globalNodes = [];
        let globalData = {};

        function init() {
            const raw = localStorage.getItem('malha_db_v2');
            if (!raw) return;
            globalData = JSON.parse(raw);
            
            const propsMap = new Map();
            if(globalData.node_props) globalData.node_props.forEach(p => propsMap.set(String(p.node_id), p));
            
            const compMap = new Map();
            if(globalData.node_composition) {
                globalData.node_composition.forEach(c => {
                    const id = String(c.node_id);
                    if(!compMap.has(id)) compMap.set(id, []);
                    compMap.get(id).push(c);
                });
            }

            globalNodes = (globalData.nodes || [])
                .filter(n => n.type !== 'valve')
                .map(n => {
                    const pid = String(n.id);
                    const phys = n.physics || propsMap.get(pid) || {};
                    const comps = n.composition || compMap.get(pid) || [];
                    
                    const compObj = {};
                    comps.forEach(c => {
                        const val = (c.value !== undefined) ? c.value : c.fraction;
                        if(val !== undefined && val !== null) compObj[c.component] = val;
                    });

                    return {
                        id: n.id,
                        name: n.name,
                        type: n.originalType || 'I',
                        physics: {
                            pressure: phys.pressure,
                            flow: phys.flow,
                            temperature: phys.temperature,
                            volume: phys.volume,
                            // não é editável aqui, mas é gravado pelo editor:
                            // tem de sobreviver a uma edição nesta página
                            elevation: phys.elevation
                        },
                        comp: compObj
                    };
                });

            render();
        }

        // A tabela é construída pelo DOM, não por interpolação de strings.
        // Nomes e ids dos nós vêm de ficheiros .rfm abertos pelo utilizador:
        // interpolados em HTML, um apóstrofo no nome partia os handlers e
        // marcação no nome era executada como HTML.

        function nameCell(node) {
            const td = document.createElement('td');
            const strong = document.createElement('strong');
            strong.textContent = node.name;
            td.appendChild(strong);
            return td;
        }

        function typeCell(node) {
            const td = document.createElement('td');
            const select = document.createElement('select');
            select.className = `type-select type-${node.type}`;
            ['P', 'Q', 'I'].forEach(t => select.add(new Option(t, t, false, node.type === t)));
            select.addEventListener('change', () => {
                node.type = select.value;
                saveToStorage();
                render();
            });
            td.appendChild(select);
            return td;
        }

        // O realce e a edição andam juntos: só o campo correspondente ao tipo
        // do nó fica ativo (P -> pressão, Q -> vazão, I -> volume).
        function numberCell(node, field, { enabled = true, highlight = null, step = '0.1' } = {}) {
            const td = document.createElement('td');
            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'input-cell' + (enabled && highlight ? ` ${highlight}` : '');
            input.step = step;
            input.value = node.physics[field] ?? '';
            input.disabled = !enabled;
            input.addEventListener('change', () => {
                node.physics[field] = input.value === '' ? null : parseFloat(input.value);
                saveToStorage();
            });
            td.appendChild(input);
            return td;
        }

        function compositionCell(node) {
            const td = document.createElement('td');
            const container = document.createElement('div');
            container.className = 'comp-container';

            SPECIES.forEach(sp => {
                const group = document.createElement('div');
                group.style.cssText = 'font-size:10px; display:flex; flex-direction:column; min-width:35px;';

                const label = document.createElement('span');
                label.style.color = '#888';
                label.textContent = sp;

                const input = document.createElement('input');
                input.type = 'text';
                input.value = node.comp[sp] ?? '';
                input.style.cssText = 'width:100%; border:1px solid #ddd; padding:2px;';
                input.addEventListener('change', () => {
                    if (input.value === '') delete node.comp[sp];
                    else node.comp[sp] = parseFloat(input.value);
                    saveToStorage();
                });

                group.append(label, input);
                container.appendChild(group);
            });

            td.appendChild(container);
            return td;
        }

        function render() {
            const tbody = document.getElementById('nodes-body');
            tbody.innerHTML = '';

            if (globalNodes.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 7;
                td.style.cssText = 'text-align:center; padding:30px; color:#999;';
                td.textContent = 'Nenhum nó encontrado.';
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }

            globalNodes.forEach(n => {
                const tr = document.createElement('tr');
                tr.append(
                    nameCell(n),
                    typeCell(n),
                    numberCell(n, 'pressure',    { enabled: n.type === 'P', highlight: 'highlight-p' }),
                    numberCell(n, 'flow',        { enabled: n.type === 'Q', highlight: 'highlight-q' }),
                    numberCell(n, 'temperature', { step: '1' }),
                    numberCell(n, 'volume',      { enabled: n.type === 'I', highlight: 'highlight-i' }),
                    compositionCell(n)
                );
                tbody.appendChild(tr);
            });
        }

        function saveToStorage() {
            globalNodes.forEach(gn => {
                const originalNode = globalData.nodes.find(n => String(n.id) === String(gn.id));
                if(originalNode) {
                    originalNode.originalType = gn.type; 
                    if(!originalNode.physics) originalNode.physics = {};
                    Object.assign(originalNode.physics, gn.physics);
                    originalNode.composition = Object.entries(gn.comp).map(([k, v]) => ({ component: k, value: v }));
                }
            });

            globalData.node_props = globalNodes.map(gn => ({
                node_id: gn.id,
                pressure: gn.physics.pressure,
                flow: gn.physics.flow,
                temperature: gn.physics.temperature,
                volume: gn.physics.volume,
                elevation: gn.physics.elevation
            }));

            globalData.node_composition = [];
            globalNodes.forEach(gn => {
                Object.entries(gn.comp).forEach(([k, v]) => {
                    globalData.node_composition.push({ 
                        node_id: gn.id, component: k, value: v, fraction: v 
                    });
                });
            });

            localStorage.setItem('malha_db_v2', JSON.stringify(globalData));
            const status = document.getElementById('save-status');
            status.style.opacity = 1;
            setTimeout(() => status.style.opacity = 0, 1500);
        }

        init();
    </script>
</body>
</html>
