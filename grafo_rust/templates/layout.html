<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - RotavaFlow</title>
    <script src="/static/js/fabric.min.js"></script>
    <script src="/static/js/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f0f0; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Barra de Menu */
        .menubar { height: 35px; background-color: #333; display: flex; align-items: center; padding: 0 10px; user-select: none; }
        .nav-link { text-decoration: none; color: #ccc; padding: 0 15px; font-size: 13px; height: 100%; display: flex; align-items: center; transition: all 0.2s; }
        .nav-link:hover { background-color: #444; color: white; }
        
        /* O Rust envia o "title". Se bater com o data-page, fica azul. */
        .nav-link[data-page="{{ title }}"] { background-color: #0078d7; color: white; font-weight: bold; }
        
        .main-container { flex-grow: 1; display: flex; position: relative; height: calc(100vh - 35px); overflow: auto; flex-direction: column; background: #eef2f5; }
    </style>
</head>
<body>
    <div class="menubar">
        <a href="/" class="nav-link" data-page="Início">Início</a>
        <a href="/canvas" class="nav-link" data-page="Editor P&ID">Editor P&ID</a>
        <a href="/nodes" class="nav-link" data-page="Nós">Nós</a>
        <a href="/ducts" class="nav-link" data-page="Tubos">Tubos</a>
        <a href="/equipments" class="nav-link" data-page="Equipamentos">Equipamentos</a>
        <a href="/simulation" class="nav-link" data-page="Simulação">Simulação</a>
        <a href="/reports" class="nav-link" data-page="Relatórios">Relatórios</a>
        <a href="/help" class="nav-link" data-page="Ajuda" style="margin-left: auto;">Ajuda</a>
    </div>

    <div class="main-container">
        {% block content %}{% endblock %}
    </div>

    {% raw %}
    <script>console.log("Layout Carregado");</script>
    {% endraw %}
</body>
</html>
