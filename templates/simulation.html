{% extends "layout.html" %}
{% block content %}
<style>
    .page-content { padding: 30px; width: 100%; max-width: 1200px; margin: 0 auto; }
    .sim-controls { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ddd; display: flex; gap: 15px; align-items: center; }
    .btn-run { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .btn-run:hover { background: #218838; }
    .btn-run:disabled { background: #ccc; cursor: not-allowed; }
    
    .status-box { padding: 10px; border-radius: 4px; font-family: monospace; font-size: 13px; background: #333; color: #0f0; margin-bottom: 20px; min-height: 40px; }
    
    .results-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 20px; }
    .results-table th { background: #eee; text-align: left; padding: 8px; border-bottom: 2px solid #ccc; }
    .results-table td { padding: 6px 8px; border-bottom: 1px solid #eee; }
    .val-cell { font-family: monospace; color: #0078d7; font-weight: bold; }
</style>

<div class="page-content">
    <h2>Simulação (Solver WASM)</h2>
    
    <div class="sim-controls">
        <button id="btn-simular" class="btn-run" onclick="iniciarSimulacao()">
            <span>▶</span> Rodar Simulação
        </button>
        <div style="flex:1">
            <label><input type="checkbox" checked> Permanente</label>
            <label style="margin-left:15px; color:#999"><input type="checkbox" disabled> Transiente (Em breve)</label>
        </div>
    </div>

    <div id="console-log" class="status-box">Aguardando comando...</div>

    <div id="results-area" style="display:none;">
        <h3>Resultados (Condições Iniciais Calculadas)</h3>
        <table class="results-table">
            <thead>
                <tr>
                    <th>Índice</th>
                    <th>Tipo</th>
                    <th>Pressão (Pa)</th>
                    <th>Temperatura (K)</th>
                    <th>Vazão (kg/s)</th>
                    <th>Densidade</th>
                </tr>
            </thead>
            <tbody id="res-body"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { runFluxo } from '/static/js/wrapper.js';
    window.runFluxoLib = runFluxo; // Expõe para o escopo global
</script>

<script>
    const logEl = document.getElementById('console-log');
    function log(msg) { logEl.innerText = msg; console.log(msg); }

    // --- 1. PREPARAR DADOS (BRIDGE) ---
    function buildSimulationData() {
        const raw = localStorage.getItem('malha_db_v2');
        if (!raw) throw new Error("Nenhum projeto salvo encontrado.");
        const data = JSON.parse(raw);

        // Mapeamentos de ID -> Índice Numérico
        const nodeMap = new Map();
        const nodes = (data.nodes || []).filter(n => n.type !== 'valve');
        nodes.forEach((n, i) => nodeMap.set(n.id, i)); // Mapeia ID "N01" -> 0

        const n_dutos = data.ducts.length;
        const n_nos = nodes.length;
        
        // Coleta TODOS os trechos de geometria em ordem linear
        // O solver espera uma lista plana de trechos, e a matriz de dutos aponta quais trechos pertencem a quem?
        // OU o solver espera que 'geometria_in' seja uma lista de TODOS os trechos de TODOS os dutos.
        // Vou assumir que geometria_in deve ter todos os segmentos sequenciais.
        
        const geometria_in = [];
        const dutos_in = [];
        let geomOffset = 0;

        data.ducts.forEach((d, idx) => {
            const startIdx = nodeMap.get(d.start_id);
            const endIdx = nodeMap.get(d.end_id);
            
            // Busca segmentos deste duto
            const segs = data.duct_geom.filter(g => g.duct_id === d.id);
            segs.sort((a,b) => (a.seg_index||0) - (b.seg_index||0));
            
            // Se não tiver geometria, cria dummy (ou avisa erro)
            if (segs.length === 0) segs.push({L:10, D:0.1, rug:0.000045, dy:0, U:0, aco:0, Tamb:298});

            segs.forEach(s => {
                // Matriz [L, dy, D, rug, U, aco, Tamb]
                geometria_in.push([
                    parseFloat(s.L || s.length || 0),
                    parseFloat(s.dy || 0),
                    parseFloat(s.D || s.diameter || 0.1),
                    parseFloat(s.rug || s.roughness || 0.000045),
                    parseFloat(s.U || 0),
                    parseFloat(s.aco || 0),
                    parseFloat(s.Tamb || 298)
                ]);
            });

            // Matriz Dutos: [indice_no_origem, indice_no_destino, qtd_trechos]
            // Nota: O wrapper faz o flatten, mas precisamos saber a ordem.
            // Geralmente solvers precisam saber onde começa a geometria. 
            // *Assumindo aqui que o solver itera geometria na mesma ordem dos dutos*
            dutos_in.push([startIdx, endIdx, segs.length]);
        });

        // Nós: [Pressão, Temperatura] (Estimativas iniciais ou condições de contorno)
        const nos_in = nodes.map(n => {
            const p = (n.physics && n.physics.pressure) ? n.physics.pressure * 100000 : 101325; // Bar -> Pa
            const t = (n.physics && n.physics.temperature) ? n.physics.temperature + 273.15 : 298.15; // C -> K
            return [p, t];
        });

        // Tipos de Nós: [Tipo] (Inteiro: 0=I, 1=P, 2=Q, etc. - Precisa confirmar seu ENUM no C++)
        // Vou chutar: 0=I, 1=P, 2=Q
        const tipos_nos_in = nodes.map(n => {
            const t = n.originalType || 'I';
            if (t === 'P') return 1;
            if (t === 'Q') return 2;
            return 0; // I
        });

        // Composição (14 componentes)
        const composicao_nos_in = nodes.map(n => {
            // Cria vetor de 14 zeros
            const v = Array(14).fill(0);
            if (n.composition) {
                // Mapear nomes C1, C2 para índices 0..13. 
                // Exemplo simplificado. Você precisa de um mapa exato: {'C1': 2, ...}
                // Vou preencher 1.0 no primeiro componente se vazio
                v[0] = 1.0; 
            } else {
                v[0] = 1.0;
            }
            return v;
        });

        // Equipamentos (Válvulas)
        const equip_in = [];
        const tipos_equip_in = [];
        const val_equip = [];
        
        // Matriz de Condição Inicial (Dummy para alocar memória)
        // Linhas = total_trechos + total_dutos (conforme seu wrapper: ci_rows = n_trechos + n_dutos)
        const n_trechos = geometria_in.length;
        const ci_rows = n_trechos + n_dutos;
        const cond_inic_in = Array.from({length: ci_rows}, () => Array(17).fill(0));

        return {
            dutos_in,
            geometria_in,
            nos_in,
            tipos_nos_in,
            composicao_nos_in,
            equip_in,
            tipos_equip_in,
            val_equip,
            numerico: [1e-6, 100], // Tolerancia, Iterações
            cond_inic_in
        };
    }

    // --- 2. EXECUTAR ---
    async function iniciarSimulacao() {
        const btn = document.getElementById('btn-simular');
        try {
            btn.disabled = true;
            log("Preparando dados da malha...");
            
            // 1. Constrói o objeto 'built'
            const builtData = buildSimulationData();
            log(`Malha: ${builtData.nos_in.length} Nós, ${builtData.dutos_in.length} Dutos, ${builtData.geometria_in.length} Trechos.`);

            // 2. Chama o Wrapper (WASM)
            log("Carregando solver WASM...");
            if (!window.runFluxoLib) throw new Error("Biblioteca WASM ainda não carregou.");
            
            const startT = performance.now();
            
            // Chama a função exportada pelo wrapper
            const resultado = await window.runFluxoLib(builtData, 'Fluxo_TS_WASM');
            
            const endT = performance.now();
            log(`Simulação concluída em ${(endT - startT).toFixed(2)}ms! Retorno: ${resultado.ret}`);

            // 3. Exibe Resultados
            exibirResultados(resultado.cond_inic_in, builtData);

        } catch (e) {
            log("Erro: " + e.message);
            console.error(e);
        } finally {
            btn.disabled = false;
        }
    }

    function exibirResultados(matrizResultados, inputData) {
        const tbody = document.getElementById('res-body');
        tbody.innerHTML = '';
        document.getElementById('results-area').style.display = 'block';

        // Exemplo: Mostrar as primeiras N linhas (que correspondem aos trechos ou dutos)
        // A matriz de retorno 'cond_inic_in' tem (n_trechos + n_dutos) linhas e 17 colunas.
        // Colunas típicas: 0=P, 1=T, 2=Vazão, 3=Rho... (Precisa bater com seu C++)
        
        matrizResultados.forEach((row, idx) => {
            if (idx >= 20) return; // Limita exibição
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${idx}</td>
                <td>${idx < inputData.geometria_in.length ? 'Trecho' : 'Fronteira'}</td>
                <td class="val-cell">${row[0].toFixed(2)}</td>
                <td class="val-cell">${row[1].toFixed(2)}</td>
                <td class="val-cell">${row[2].toFixed(4)}</td>
                <td class="val-cell">${row[3].toFixed(4)}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
{% endblock %}
