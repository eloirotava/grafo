{% extends "layout.html" %}

{% block content %}
<style>
    .hero {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 100%; height: 100%; text-align: center; color: #444;
        background: radial-gradient(circle at center, #fff 0%, #f4f4f4 100%);
    }
    .hero h1 { font-size: 3em; font-weight: 300; margin-bottom: 10px; color: #222; }
    .hero p { font-size: 1.2em; color: #666; max-width: 600px; margin-bottom: 40px; }
    .cta-button {
        padding: 15px 40px; font-size: 1.2em; background-color: #0078d7; color: white;
        text-decoration: none; border-radius: 50px; font-weight: 600;
        box-shadow: 0 4px 15px rgba(0, 120, 215, 0.3); transition: transform 0.2s, box-shadow 0.2s;
    }
    .cta-button:hover {
        transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 120, 215, 0.4); background-color: #005a9e;
    }
    .version { margin-top: 60px; font-size: 0.9em; color: #999; }
</style>

<div class="hero">
    <div style="font-size: 4em; margin-bottom: 20px;">🌊</div>
    <h1>RotavaFlow</h1>
    <p>Simulação de escoamento composicional offline, rápida e precisa direto no seu navegador.</p>
    
    <a href="/canvas" class="cta-button">
        Iniciar Novo Projeto
    </a>

    <div class="version">Versão 2.1 (WASM Edition) • Modo Offline Ativo</div>
</div>
{% endblock %}
