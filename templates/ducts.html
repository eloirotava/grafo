{% extends "layout.html" %}
{% block content %}
<style>
    .page-content { padding: 30px; width: 100%; max-width: 1200px; margin: 0 auto; }
    h2 { color: #333; border-bottom: 2px solid #0078d7; padding-bottom: 10px; margin-bottom: 20px; }
    
    .data-table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-radius: 4px; font-size: 13px; }
    .data-table th, .data-table td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
    .data-table th { background-color: #f8f9fa; font-weight: 600; color: #444; border-bottom: 2px solid #ddd; }
    
    .badge-geom { background: #eee; padding: 2px 6px; border-radius: 10px; font-size: 11px; border: 1px solid #ccc; }
    .text-center { text-align: center; }
    .mono { font-family: monospace; color: #555; }
</style>

<div class="page-content">
    <h2>Dutos (Tubulação e Geometria)</h2>
    
    <table class="data-table">
        <thead>
            <tr>
                <th style="width: 10%;">Tag</th>
                <th style="width: 20%;">Conexão (De &rarr; Para)</th>
                <th class="text-center" style="width: 12%;">Comp. Total (m)</th>
                <th class="text-center" style="width: 12%;">Diâmetro Ref. (pol)</th>
                <th class="text-center" style="width: 12%;">Δ Elevação (m)</th>
                <th class="text-center" style="width: 10%;">Segmentos</th>
            </tr>
        </thead>
        <tbody id="ducts-body"></tbody>
    </table>
</div>

<script>
    function loadDucts() {
        const raw = localStorage.getItem('malha_db_v2');
        if (!raw) return { ducts: [], nodes: [], geom: [] };
        const data = JSON.parse(raw);
        
        // Mapa de Nós para pegar nomes
        const nodeMap = new Map();
        if(data.nodes) data.nodes.forEach(n => nodeMap.set(n.id, n.name));

        // Agrupar geometria por duct_id
        const geomMap = new Map();
        if(data.duct_geom) {
            data.duct_geom.forEach(g => {
                if(!geomMap.has(g.duct_id)) geomMap.set(g.duct_id, []);
                geomMap.get(g.duct_id).push(g);
            });
        }

        return { 
            ducts: data.ducts || [], 
            nodeMap, 
            geomMap 
        };
    }

    const { ducts, nodeMap, geomMap } = loadDucts();
    const tbody = document.getElementById('ducts-body');

    if(ducts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#999;">Nenhum duto encontrado.</td></tr>';
    } else {
        ducts.forEach(d => {
            const tr = document.createElement('tr');
            
            // Resolve nomes
            const fromName = nodeMap.get(d.start_id) || d.start_id || '?';
            const toName = nodeMap.get(d.end_id) || d.end_id || '?';

            // Calcula geometria
            const segs = d.geometry || geomMap.get(d.id) || [];
            let totalL = 0;
            let totalDy = 0;
            let refD = 0;

            if(segs.length > 0) {
                // Ordena por índice do segmento
                segs.sort((a,b) => (a.seg_index||0) - (b.seg_index||0));
                
                segs.forEach(s => {
                    totalL += (parseFloat(s.length) || parseFloat(s.L) || 0);
                    totalDy += (parseFloat(s.dy) || 0); // dy é a elevação
                });
                // Pega diâmetro do primeiro segmento
                refD = parseFloat(segs[0].diameter || segs[0].D || 0);
            } else {
                // Fallback para propriedades diretas (legado)
                totalL = d.length || 0;
            }

            tr.innerHTML = `
                <td><strong>${d.name}</strong></td>
                <td><span class="mono">${fromName}</span> &rarr; <span class="mono">${toName}</span></td>
                <td class="text-center"><strong>${totalL.toFixed(1)}</strong></td>
                <td class="text-center">${refD > 0 ? refD.toFixed(2) + '"' : '-'}</td>
                <td class="text-center">${totalDy.toFixed(1)}</td>
                <td class="text-center"><span class="badge-geom">${segs.length} trechos</span></td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
{% endblock %}
